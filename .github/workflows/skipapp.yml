name: skipapp-ahoy
on:
  push:
    branches: '*'
    tags: "[0-9]+.[0-9]+.[0-9]+"
  schedule:
    - cron: '30 6 * * *'
  workflow_dispatch:
  pull_request:

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  verify-app:
    runs-on: macos-15-intel
    steps:
      - name: Cache Homebrew packages
        uses: actions/cache@v5
        with:
          path: ~/Library/Caches/Homebrew
          key: homebrew-packages
      - uses: skiptools/actions/setup-skip@v1
      - uses: actions/checkout@v6
        with:
          path: skipapp-ahoy-repo
      - name: Compare ahoy-skip template with skipapp-ahoy repo
        run: |
          ./skipapp-ahoy-repo/scripts/diff_template.sh skipapp-ahoy skipapp-ahoy-repo
  call-workflow:
    # TESTING ONLY — restore to @v1 once https://github.com/skiptools/actions/pull/20 is merged and released
    uses: skiptools/actions/.github/workflows/skip-app.yml@swiftbuild-native
    with:
      run-local-tests: false
      # release (Xcode 26 / Swift 6.3, `native`) and preview (Xcode 27 beta / Swift 6.4,
      # `swiftbuild`) toolchains in parallel
      swift-toolchains: dual
      # The preview variant needs GitHub's `xcode-27` image: the standard macos-26 image
      # ships Xcode 26.x only. Switch to `xcode-27-xlarge` if the preview image queues,
      # since its capacity is still limited.
      preview-runs-on: xcode-27
      # TESTING ONLY — build skip from the skipstone PR branch rather than the released
      # formula/cask, since dual mode needs the --build-system support that branch adds.
      # Remove once skipstone#swiftbuild-native ships in a release.
      skip-source: swiftbuild-native

